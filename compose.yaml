name: resilience-alpha
x-app: &app
  image: resilience-python:lab
  build: {context: ., dockerfile: Dockerfile}
  restart: unless-stopped
  read_only: true
  user: '10001:10001'
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  tmpfs: ['/tmp:rw,noexec,nosuid,size=128m']
  environment: {LOG_DIR: /logs, STATE_DIR: /state, MODEL_DIR: /models, HOME: /tmp}
  logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  mem_limit: 700m
services:
  init:
    image: busybox:1.37.0
    user: '0:0'
    command: ['sh','-c','chown -R 10001:10001 /logs /models /payment-state /incident-state; chmod 750 /logs /models /payment-state /incident-state; chown -R 101:101 /waflogs; chmod 755 /waflogs']
    volumes: ['logs:/logs','models:/models','payment-state:/payment-state','incident-state:/incident-state','waflogs:/waflogs']
    network_mode: none
    restart: 'no'
  db:
    image: postgres:17.4-alpine
    environment: {POSTGRES_DB: payments, POSTGRES_USER: payments, POSTGRES_PASSWORD_FILE: /run/secrets/db_password}
    secrets: [db_password]
    volumes: ['pgdata:/var/lib/postgresql/data']
    networks: [data]
    healthcheck: {test: ['CMD-SHELL','pg_isready -U payments -d payments'], interval: 3s, timeout: 3s, retries: 20}
    restart: unless-stopped
    mem_limit: 400m
  auth:
    <<: *app
    command: ['python','-m','uvicorn','services.auth.main:app','--host','0.0.0.0','--port','8000','--no-access-log']
    secrets: [session_key, alice_password, loadbot_password]
    volumes: ['logs:/logs']
    networks: [app]
    depends_on: {init: {condition: service_completed_successfully}}
  payment:
    <<: *app
    command: ['python','-m','uvicorn','services.payment.main:app','--host','0.0.0.0','--port','8000','--workers','1','--no-access-log']
    secrets: [session_key, db_password, control_key]
    volumes: ['logs:/logs','payment-state:/state']
    networks: [app, data, control, observe]
    depends_on: {init: {condition: service_completed_successfully}, db: {condition: service_healthy}}
    healthcheck: {test: ['CMD','python','-c',"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"], interval: 5s, timeout: 3s, retries: 12}
  # Ansible resout son dossier temporaire via la base passwd (/home/app), pas via $HOME, et la racine est en
  # lecture seule : sans ces trois variables, TOUT module Ansible echoue ("Failed to create temporary directory"),
  # donc chaque incident finirait en failed/manual_review_required. `--syntax-check` ne le detecte pas.
  # Un environment local remplace celui de l'ancre x-app : les variables partagees sont repetees.
  remediator:
    <<: *app
    environment: {LOG_DIR: /logs, STATE_DIR: /state, MODEL_DIR: /models, HOME: /tmp,
                  ANSIBLE_HOME: /tmp/.ansible, ANSIBLE_LOCAL_TEMP: /tmp/.ansible/tmp, ANSIBLE_REMOTE_TEMP: /tmp/.ansible/tmp}
    command: ['python','-m','uvicorn','services.remediator.main:app','--host','0.0.0.0','--port','8000','--no-access-log']
    secrets: [session_key, alert_key, control_key, alice_password]
    volumes: ['logs:/logs','incident-state:/state']
    networks: [app, control, observe, front]
    depends_on: {init: {condition: service_completed_successfully}}
  detector:
    <<: *app
    # A local `environment` replaces the x-app one (no deep merge): the shared variables are repeated.
    # DETECTOR_NU is read by train.py (docker compose exec), DETECTOR_CONSECUTIVE by the alert loop.
    environment: {LOG_DIR: /logs, STATE_DIR: /state, MODEL_DIR: /models, HOME: /tmp, DETECTOR_NU: '${DETECTOR_NU:-0.02}', DETECTOR_CONSECUTIVE: '${DETECTOR_CONSECUTIVE:-3}'}
    command: ['python','-m','uvicorn','services.detector.main:app','--host','0.0.0.0','--port','8000','--no-access-log']
    secrets: [alert_key]
    volumes: ['logs:/logs','models:/models']
    networks: [observe]
    depends_on: {init: {condition: service_completed_successfully}, prometheus: {condition: service_started}, loki: {condition: service_started}}
  frontend:
    build: {context: frontend}
    networks: [app]
    restart: unless-stopped
    mem_limit: 100m
  edge:
    image: nginx:1.27.5-alpine
    volumes: ['./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    networks: [front, app, observe]
    depends_on: [auth, payment, frontend, remediator, detector, rag]
    restart: unless-stopped
    mem_limit: 100m
  waf:
    image: owasp/modsecurity-crs:nginx
    environment:
      BACKEND: http://edge:8080
      PORT: '8080'
      MODSEC_RULE_ENGINE: 'On'
      BLOCKING_PARANOIA: '1'
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit.log
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_PARTS: AFZ
    ports: ['${LAB_BIND:-127.0.0.1}:${LAB_PORT:-8081}:8080']   # port publie configurable : 8080 est pris par un autre service sur le PC Hote
    volumes: ['waflogs:/var/log/modsecurity']
    networks: [front]
    depends_on: [edge]
    restart: unless-stopped
    mem_limit: 400m
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.retention.time=2d']
    volumes: ['./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro','promdata:/prometheus']
    networks: [observe]
    restart: unless-stopped
    mem_limit: 400m
  loki:
    image: grafana/loki:3.4.2
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes: ['./infra/loki/config.yaml:/etc/loki/local-config.yaml:ro','lokidata:/loki']
    networks: [observe]
    restart: unless-stopped
    mem_limit: 600m
  alloy:
    image: grafana/alloy:v1.8.2
    user: '0:0' # Read-only log access only; no Docker socket.
    command: ['run','--storage.path=/var/lib/alloy','/etc/alloy/config.alloy']
    volumes: ['./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro','logs:/logs:ro','waflogs:/waflogs:ro','alloydata:/var/lib/alloy']
    networks: [observe]
    depends_on: [loki]
    restart: unless-stopped
    mem_limit: 250m
  # Sur `mgmt` EN PLUS de `observe` : un conteneur attache uniquement a un reseau `internal: true` ne peut pas
  # publier de port (Docker accepte la declaration et ne la realise jamais). `mgmt` ne porte que Grafana.
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    secrets: [grafana_password]
    ports: ['127.0.0.1:3000:3000']
    volumes: ['./infra/grafana/provisioning:/etc/grafana/provisioning:ro','./infra/grafana/dashboard.json:/var/lib/grafana/dashboards/resilience.json:ro','grafanadata:/var/lib/grafana']
    networks: [observe, mgmt]
    restart: unless-stopped
    mem_limit: 400m
  ollama:
    image: ollama/ollama:0.6.6
    volumes: ['ollamadata:/root/.ollama']
    networks: [ai]
    restart: unless-stopped
    mem_limit: 3500m
  rag:
    image: resilience-rag:lab
    build: {context: ., dockerfile: Dockerfile.rag}
    secrets: [session_key]
    volumes: ['./docs:/docs:ro']
    networks: [app, ai]
    environment: {OLLAMA_URL: '${OLLAMA_URL:-http://ollama:11434}'}
    read_only: true
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp']
    restart: unless-stopped
    mem_limit: 700m
networks:
  front: {}
  mgmt: {}   # non interne, uniquement pour publier Grafana sur 127.0.0.1 (voir le commentaire du service grafana)
  app: {internal: true}
  data: {internal: true}
  control: {internal: true}
  observe: {internal: true}
  ai: {} # Egress only needed to download the local model; no published Ollama port.
volumes:
  logs: {}
  models: {}
  payment-state: {}
  incident-state: {}
  pgdata: {}
  promdata: {}
  lokidata: {}
  alloydata: {}
  grafanadata: {}
  ollamadata: {}
  waflogs: {}
secrets:
  db_password: {file: ./.secrets/runtime/db_password}
  session_key: {file: ./.secrets/runtime/session_key}
  control_key: {file: ./.secrets/runtime/control_key}
  alert_key: {file: ./.secrets/runtime/alert_key}
  alice_password: {file: ./.secrets/runtime/alice_password}
  loadbot_password: {file: ./.secrets/runtime/loadbot_password}
  grafana_password: {file: ./.secrets/runtime/grafana_password}
