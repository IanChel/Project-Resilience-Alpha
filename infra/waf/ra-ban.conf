# Temporary source ban (carte W1). Loaded only with compose.ban.yaml.
# /bans/ban.list holds one address per line, written by the remediator's playbook from the SIGNED alert
# (services/remediator/bans.py): only lab-subnet addresses, never the Host PC, each with an expiry.
# The list is read at load time: waf-reload sends nginx a SIGHUP when it changes.
# phase:1 runs before any body is read, so a banned address costs the WAF almost nothing.
SecRule REMOTE_ADDR "@ipMatchFromFile /bans/ban.list" \
    "id:1900001,phase:1,deny,status:403,log,msg:'RESILIENCE temporary source ban',tag:'resilience/ban'"
