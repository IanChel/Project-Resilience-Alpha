server {
  listen 8080;
  server_tokens off;
  client_max_body_size 8k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
  location = /auth/token { proxy_pass http://auth:8000/token; }
  location = /api/payments { proxy_pass http://payment:8000/payments; }
  location = /api/quotes { proxy_pass http://payment:8000/quotes; }
  location = /api/accounts { proxy_pass http://payment:8000/accounts; }
  location = /api/ready { proxy_pass http://payment:8000/ready; }
  location = /ops/status { limit_except GET { deny all; } proxy_pass http://remediator:8000/status; }
  # Detector health contains no secrets; exposed only after operator auth_request.
  location = /_operator { internal; proxy_pass http://payment:8000/accounts; proxy_pass_request_body off; proxy_set_header Content-Length ''; }
  location = /ops/ml { auth_request /_operator; proxy_pass http://detector:8000/health; }
  location = /rag/ask { proxy_read_timeout 100s; proxy_pass http://rag:8000/ask; }
  location /api/ { return 404; }
  location /ops/ { return 404; }
  location /auth/ { return 404; }
  location /rag/ { return 404; }
  location / { proxy_pass http://frontend:8080; }
}
